[project]
name = "botwatch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.13", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
